# ============================================================
#  ENGULFIC — Docker Compose (Dev)
#  VPS Path: /engulf/dev
#  Run: docker compose up -d
# ============================================================

services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://server.engulfic.com}
    container_name: ${FRONTEND_CONTAINER_NAME:-engulfic-frontend}
    restart: always
    ports:
      - "${FRONTEND_PORT:-8001}:8001"
    networks:
      - engulfic-net

networks:
  engulfic-net:
    driver: bridge
