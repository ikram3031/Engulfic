# ============================================================
#  ENGULFIC — Nginx Reverse Proxy
#  Domains:
#    Frontend  → https://engulfic.com
#    Backend   → https://server.engulfic.com
#    Dashboard → https://dashboard.engulfic.com
#
#  Place at: /etc/nginx/sites-available/engulfic
#  Enable:   ln -s /etc/nginx/sites-available/engulfic /etc/nginx/sites-enabled/
#  SSL:      certbot --nginx -d engulfic.com -d www.engulfic.com \
#                             -d server.engulfic.com \
#                             -d dashboard.engulfic.com
#  Test:     nginx -t && systemctl reload nginx
# ============================================================

# ── Upstreams ────────────────────────────────────────────────
upstream engulfic_frontend {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream engulfic_backend {
    server 127.0.0.1:5092;
    keepalive 32;
}

upstream engulfic_dashboard {
    server 127.0.0.1:8005;
    keepalive 32;
}

# ============================================================
#  HTTP → HTTPS redirects
# ============================================================

server {
    listen 80;
    server_name engulfic.com www.engulfic.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://engulfic.com$request_uri; }
}

server {
    listen 80;
    server_name server.engulfic.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    server_name dashboard.engulfic.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ============================================================
#  HTTPS — Frontend (engulfic.com)
# ============================================================

server {
    listen 443 ssl http2;
    server_name engulfic.com www.engulfic.com;

    ssl_certificate     /etc/letsencrypt/live/engulfic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/engulfic.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/engulfic-frontend.log;
    error_log  /var/log/nginx/engulfic-frontend-error.log;

    # Canonical redirect: www → non-www
    if ($host = www.engulfic.com) {
        return 301 https://engulfic.com$request_uri;
    }

    location / {
        proxy_pass         http://engulfic_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}

# ============================================================
#  HTTPS — Backend API (server.engulfic.com)
# ============================================================

server {
    listen 443 ssl http2;
    server_name server.engulfic.com;

    ssl_certificate     /etc/letsencrypt/live/server.engulfic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.engulfic.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/engulfic-backend.log;
    error_log  /var/log/nginx/engulfic-backend-error.log;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://engulfic_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}

# ============================================================
#  HTTPS — Dashboard (dashboard.engulfic.com)
# ============================================================

server {
    listen 443 ssl http2;
    server_name dashboard.engulfic.com;

    ssl_certificate     /etc/letsencrypt/live/dashboard.engulfic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.engulfic.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/engulfic-dashboard.log;
    error_log  /var/log/nginx/engulfic-dashboard-error.log;

    location / {
        proxy_pass         http://engulfic_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
